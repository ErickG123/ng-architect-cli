name: Publicar CLI no GitHub Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag para fazer deploy (ex: v1.0.0)'
        required: true
        type: string

jobs:
  test-cli:
    name: Testes Unitários
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: 📦 Instalar dependências da CLI
        run: npm ci

      - name: 🧪 Rodar Testes
        run: npm run test

  build-and-publish:
    name: Publicar
    needs: test-cli
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://npm.pkg.github.com"

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🔨 Compilar TypeScript
        run: npm run build

      - name: 🚀 Publicar Pacote
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
