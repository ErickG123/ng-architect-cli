name: Publicar CLI no GitHub Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag para fazer deploy (ex: v1.0.0)'
        required: true
        type: string

jobs:
  validate-cli:
    name: Validação E2E (Failsafe)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: 📦 Instalar dependências da CLI
        run: npm ci

      - name: 🔨 Compilar CLI
        run: npm run build

      - name: 🔗 Link da CLI (Global)
        run: npm link

      - name: 🤖 Instalar Expect para interagir com os Prompts
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: 🧪 Gerar Projeto Dummy com Expect
        run: |
          mkdir /tmp/dummy-project
          cd /tmp/dummy-project
          
          expect -c '
          set timeout 300
          
          spawn env FORCE_COLOR=0 create-ng-arch
          
          expect "Qual é o nome"
          sleep 0.5
          send "dummy-app\r"
          
          expect "gerenciador"
          sleep 0.5
          send "\r"
          
          expect "Zoneless"
          sleep 0.5
          send "\r"
          
          expect "biblioteca de UI"
          sleep 0.5
          send "\r"
          
          expect "SignalStore"
          sleep 0.5
          send "\r"
          
          expect "Template Inicial"
          sleep 0.5
          send "\r"
          
          expect "Dockerfile"
          sleep 0.5
          send "\r"
          
          expect "ESLint"
          sleep 0.5
          send "\r"
          
          expect "workflow de CI"
          sleep 0.5
          send "\r"
          
          expect eof
          '
          
      - name: 🏗️ Validar Build do Projeto Gerado
        run: |
          cd /tmp/dummy-project/dummy-app
          npm run build

  build-and-publish:
    name: Publicar
    needs: validate-cli
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://npm.pkg.github.com"

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🔨 Compilar TypeScript
        run: npm run build

      - name: 🚀 Publicar Pacote
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
